        source: "require 'vendor/autoload.php';\n\nuse \\Gnello\\Mattermost\\Driver;\n\n$container = new \\Pimple\\Container([\n\
          \    \"driver\" => [\n        \"url\" => \"https://your-mattermost-url.com\",\n        \"login_id\" => \"email@domain.com\"\
