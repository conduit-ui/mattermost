        in: query
        name: set_system_admin
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                locale:
                  type: string
                nickname:
                  type: string
                notify_props:
                  $ref: '#/components/schemas/UserNotifyProps'
                password:
                  type: string
                position:
                  type: string
                props:
                  type: object
